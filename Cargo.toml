[package]
name = "cnet"
version = "0.1.0"
edition = "2021"

description = "A wireshark-lite terminal UI: live packet capture, device discovery, and LAN port scanning"
license = "MIT"
repository = "https://github.com/isaaclins/cnet"
readme = "README.md"
keywords = ["network", "tui", "packet-capture", "pcap", "scanner"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
get_if_addrs = "0.5"
ipnetwork = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "time", "io-util", "sync"] }
futures = "0.3"
arboard = { version = "3", default-features = false }
open = "5"
pcap = "2"
regex = "1"
libc = "0.2"
